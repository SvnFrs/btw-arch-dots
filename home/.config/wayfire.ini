# Core options

[core]

# List of plugins to be enabled.
# See the Configuration document for a complete list.
plugins = \
  alpha \
  animate \
  autostart \
  command \
  decoration \
  expo \
  fast-switcher \
  focus-change \
  follow-focus \
  foreign-toplevel \
  grid \
  gtk-shell \
  input-method-v1 \
  ipc \
  ipc-rules \
  move \
  oswitch \
  place \
  resize \
  scale \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswipe \
  vswitch \
  window-rules \
  wm-actions \
  zoom \
  spread-overview

# Close focused window.
close_top_view = <super> KEY_W | <alt> KEY_F4

# Workspaces arranged into a grid: 3 × 3.
vwidth = 3
vheight = 3

# Prefer client-side decoration or server-side decoration
preferred_decoration_mode = client

xwayland = true

# Input configuration

# Example configuration:
#
[input]
scroll_method = default
natural_scroll = true
touchpad_cursor_speed = 0.3
# fastfetch reports GTK using GoogleDot-Black, while this sets White ->
# the pointer changes colour when it crosses between compositor and client areas.
# Pick ONE and set it in both places. If you want White, change GTK with:
#     gsettings set org.gnome.desktop.interface cursor-theme GoogleDot-White
# If you want Black instead, change the line below to GoogleDot-Black.
cursor_theme = GoogleDot-White
cursor_size = 24

# xkb_layout = us,fr
# xkb_variant = dvorak,bepo
# xkb_options = grp:win_space_toggle
#
# See Input options for a complete reference.
# https://github.com/WayfireWM/wayfire/wiki/Configuration#input

# Output configuration

# Example configuration:
#
# [output:eDP-1]
# mode = 1920x1080@60000
# position = 0,0
# transform = normal
# scale = 1.000000
#
# You can get the names of your outputs with wlr-randr.
# https://github.com/emersion/wlr-randr
#
# See also kanshi for configuring your outputs automatically.
# https://wayland.emersion.fr/kanshi/
#
# See Output options for a complete reference.
# https://github.com/WayfireWM/wayfire/wiki/Configuration#output

# Outputs are managed by kanshi: ~/.config/kanshi/config (profiles code/train/laptop).
#
# Do NOT set `mode = off` for eDP-1 or DP-3 here. It is static and applies BEFORE
# kanshi, so if kanshi isn't running (or the G5 is unplugged) there may be no screen
# left on. No section = mode auto = on; let kanshi turn the extra one off.
#
# HDMI-A-1 is the SAME G5 on a second cable, plugged into the NVIDIA GPU. It is off for good
# here so the 3060 can sleep from login on; every kanshi profile turns it off too.
[output:HDMI-A-1]
mode = off

# Once kanshi has configured the outputs, Wayfire ignores [output:*] when it reloads this
# file. Without this line, every save of wayfire.ini would overwrite the kanshi profile.
[workarounds]
use_external_output_configuration = true

# Autostart
[autostart]
#Gtk+3 applications slow startup or .desktop files not opening
#https://github.com/WayfireWM/wayfire/wiki/Tips-&-Tricks#gtk3-applications-slow-startup-or-desktop-files-not-opening
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# THE `export` LINES BELOW ARE NO-OPS — commented out.
# Wayfire spawns each autostart entry as its OWN process; `export FOO=bar`
# sets the variable in that child shell, which exits at once, and no other process sees it.
# To really set them, set them BEFORE wayfire starts, with a wrapper:
#     ~/.local/bin/start-wayfire  (chmod +x, launch this instead of `wayfire`)
#         #!/bin/sh
#         export XDG_CURRENT_DESKTOP=wayfire
#         export XDG_SESSION_TYPE=wayland
#         export OZONE_PLATFORM=wayland
#         export GTK_IM_MODULE=fcitx QT_IM_MODULE=fcitx
#         export XMODIFIERS=@im=fcitx INPUT_METHOD=fcitx
#         exec wayfire "$@"
# Check afterwards:
#     grep -z OZONE_PLATFORM /proc/$(pgrep -f 'wayfire$'|head -1)/environ | tr '\0' '\n'
# Note: the 0_env line above passes XDG_CURRENT_DESKTOP to dbus, but
# if that variable isn't set yet, it passes an EMPTY string.
# 1_env = export OZONE_PLATFORM=wayland
# 2_env = export GTK_IM_MODULE=fcitx
# 3_env = export QT_IM_MODULE=fcitx
# 4_env = export XMODIFIERS=@im=fcitx
# 5_env = export INPUT_METHOD=fcitx

# Start fcitx5
fcitx5 = fcitx5 -d

# Start blur on inactive windows.
blur_on_inactive  = ~/.config/ipc-scripts/inactive-alpha.py

awww = sh -c 'awww-daemon & until awww query >/dev/null 2>&1; do sleep 0.1; done; awww img ~/Pictures/Wallpapers/girl.png'

# Clipboard history — https://github.com/sentriz/cliphist
# cliphist doesn't watch the clipboard itself; it is only a store + pipe. `wl-paste
# --watch` is what listens, and it must run ONCE per session.
# Two lines: one for text, one for images. Running `--watch` several times with different
# --type values is the official way to catch several MIME types.
# Screenshots from actions.sh land in this history too (it uses wl-copy).
#
# REQUIRES: `wl-paste --watch` needs the wlr-data-control-unstable-v1 protocol.
# Check that your Wayfire has it:
#     wayland-info 2>/dev/null | grep -i data_control
# Without it, wl-paste --watch receives nothing (cliphist stays silent, no error).
cliphist_text = wl-paste --type text --watch cliphist store
cliphist_image = wl-paste --type image --watch cliphist store

screen_sharing_fix = ~/.config/wayfire/ss-fix.sh

polkit-agent = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

keyring = dbus-update-activation-environment --all && gnome-keyring-daemon --start --components=secrets,ssh,pkcs11

# nvidia = export WLR_DRM_DEVICES=/dev/dri/card0:/dev/dri/card1

# Automatically start background and panel.

# Set the wallpaper, start a panel and dock if you want one.
# https://github.com/WayfireWM/wf-shell
#
# These are started by the autostart_wf_shell option above.
#
# background = wf-background
# panel = wf-panel
#
# You may also use wf-dock,
# which is included in wf-shell but is not enabled by default.
#
# dock = wf-dock

# Output configuration
# https://wayland.emersion.fr/kanshi/
outputs = kanshi

# Notifications
notifications = swaync

# Recording island (docs/capture-ui.md). It only READS $XDG_RUNTIME_DIR/capture/rec.json;
# actions.sh is still the only thing that runs wf-recorder.
capture-ui = qs -c enhalation

# Screen color temperature
# https://sr.ht/~kennylevinsen/wlsunset/
# OFF: the 󰛨 button in swaync manages wlsunset (with the HCMC coordinates 10.8/106.6 and
# 4000K-6500K). If both managed it, the button would show the state of an instance this
# line spawned with the WRONG arguments. One source of truth only.
# To have wlsunset start at login, uncomment the line below AND remove the button from
# ~/.config/swaync/config.json (buttons-grid actions[1]).
# gamma = wlsunset

# XDG desktop portal
# Needed by some GTK applications
session_target = systemctl --user start graphical-session.target

# Command
[command]

# Window switcher
binding_window_switcher = <alt> KEY_ENTER
command_window_switcher = sh $HOME/.config/rofi/bin/window-switcher

# Start a terminal
# https://github.com/alacritty/alacritty
binding_terminal = <super> KEY_T
command_terminal = kitty

# Start a file manager
binding_explorer = <super> KEY_E
command_explorer = nautilus

# Start your launcher
# https://github.com/davatorium/rofi.git
binding_launcher = <super> KEY_ENTER
# command_launcher = rofi -show drun
command_launcher = sh $HOME/.config/rofi/bin/launcher

# Logout
# https://github.com/ArtsyMacaw/wlogout
binding_logout = <super> KEY_ESC
command_logout = wlogout
# command_logout = .config/rofi/bin/powermenu

# NOTE: the commands below call `bash <path>`, NOT the script directly.
# Why: calling it directly needs the exec bit (+x), and that bit is LOST whenever the file
# is downloaded or copied from elsewhere. Symptom when it's gone: `bash -x script.sh` runs
# fine, but the keybinding does nothing and the log gets no new entry — because the script
# never started. Calling through `bash` doesn't depend on +x.
# (It has to be `bash`, not `sh`: the script uses [[ ]], arrays and bash-style ${var:-}.)
#
# Screenshots & screen recording
# https://wayland.emersion.fr/grim/  |  https://wayland.emersion.fr/slurp/
# https://github.com/ammen99/wf-recorder
#
# All of them call ~/.config/swaync/actions.sh — the same script the swaync buttons
# use. That buys three things:
#   - one place to fix both the keybindings and the buttons
#   - every run is logged: ~/.cache/swaync-actions.log
#   - rec/rec-area are real TOGGLES: the second press stops; it never spawns a second recording
#
# The old version had 3 bugs, confirmed in the log:
#   a) `-a "$(pactl ...)"` — wf-recorder does not accept "-a DEVICE" with a space;
#      -a's argument is optional, so it must be written --audio=DEVICE. Consequence: it
#      recorded the MIC instead of the desktop audio.
#   b) `$(xdg-user-dir)` with no argument always returns $HOME. Your machine has no
#      ~/.config/user-dirs.dirs, so `xdg-user-dir PICTURES` returns $HOME too
#      -> screenshots landed in ~/Screenshots, videos in ~/Recordings.
#   c) %T puts colons in the file name (14:32:05.png).
binding_screenshot = KEY_SYSRQ
# PrtSc opens the capture overlay (docs/capture-ui.md §6). `shot` (the whole screen at
# once) is still there, and is the fallback when Quickshell isn't running.
command_screenshot = sh -c 'setsid -f bash "$HOME"/.config/swaync/actions.sh capture-open area photo'
binding_screenshot_interactive = <super> <shift> KEY_S
command_screenshot_interactive = sh -c 'setsid -f bash "$HOME"/.config/swaync/actions.sh snip'

# Super+PrtSc: while recording it stops; otherwise it opens the overlay in Video
# (docs/capture-ui.md §6). `rec` (record the whole screen at once) is still there.
binding_recording = <super> KEY_SYSRQ
command_recording = sh -c 'setsid -f bash "$HOME"/.config/swaync/actions.sh capture-open area video'
binding_recording_interactive = <shift> <super> KEY_SYSRQ
command_recording_interactive = sh -c 'setsid -f bash "$HOME"/.config/swaync/actions.sh rec-area'

# Volume controls
#
# TWO BUGS OF `amixer set Master`:
#
#  1) WRONG LAYER. amixer talks STRAIGHT to the ALSA mixer, which sits BELOW PipeWire.
#     swaync reads the volume through libpulse. Press a key -> ALSA changes, the swaync
#     slider doesn't move; drag the slider -> PipeWire changes, ALSA stays; press KEY_MUTE ->
#     ALSA mutes, everything goes silent, and swaync still shows the sound on.
#
#  2) CHANNEL DRIFT. The relative form (`5%+`) adds the delta to EACH channel and rounds
#     each on its own. ALSA Master on Intel HDA has only a few dozen integer steps, and 5%
#     doesn't divide evenly -> front-left and front-right round differently and drift apart.
#     Once they drift they NEVER come back, because every press adds the same
#     delta to both.
#
# actions.sh reads the current value and writes an ABSOLUTE VALUE (`pactl set-sink-
# volume SINK 65%`), with no channel prefix -> the same number goes to EVERY channel.
# The two sides cannot drift, and if they already have, the first press rebalances them.
# Capped at 100%, floored at 0%. To change the step: VOL_STEP=10 in the command below.
#
# Check (run before and after pressing the keys a few times):
#     pactl get-sink-volume @DEFAULT_SINK@ | head -1
# Rebalance right away:
#     pactl set-sink-volume @DEFAULT_SINK@ 100%
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = sh -c 'bash "$HOME"/.config/swaync/actions.sh vol-up'
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = sh -c 'bash "$HOME"/.config/swaync/actions.sh vol-down'
binding_mute = KEY_MUTE
command_mute = sh -c 'bash "$HOME"/.config/swaync/actions.sh vol-mute'

# Mic mute — the same device the 󰍬 button in swaync controls (@DEFAULT_SOURCE@).
binding_mic_mute = KEY_MICMUTE
command_mic_mute = sh -c 'bash "$HOME"/.config/swaync/actions.sh mic-mute'

# Screen brightness
# https://github.com/Hummer12007/brightnessctl
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = brightnessctl set +1%
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = brightnessctl set 1%-

# Toggle notification center.
# This USED TO call shade.sh — a script that rewrote config.json on every press to update
# the buttons' labels and states. DROPPED FOR GOOD: it was the source of nearly all the
# trouble (flock, toggle/refresh ordering, button states out of sync with the system, the
# config file rewritten constantly). Calling swaync-client directly: no state, no file
# rewritten, opens instantly.
binding_swaync = <super> KEY_N
command_swaync = swaync-client -t -sw

# Calendar + date and time.
# swaync has NO calendar widget (built-in widgets: title, dnd, notifications,
# label, mpris, menubar, buttons-grid, volume, backlight, slider). So the calendar is
# sent as ONE NOTIFICATION — swaync still shows it, but without the machinery that
# rewrote config.json like the old shade.sh.
# Pressing again REPLACES the old notification (notify-send -r) instead of stacking them.
# Clipboard history. Super+V opens the picker, Super+Shift+V deletes an entry.
binding_clipboard = <super> KEY_V
command_clipboard = sh -c 'bash "$HOME"/.config/swaync/actions.sh clip'
binding_clipboard_del = <super> <shift> KEY_V
command_clipboard_del = sh -c 'bash "$HOME"/.config/swaync/actions.sh clip-del'

binding_calendar = <super> KEY_D
command_calendar = sh -c 'bash "$HOME"/.config/swaync/actions.sh cal'

# Vibe coding mode - Only use the G5 monitor, turn off the laptop screen.
# Both profiles live in ~/.config/kanshi/config.
binding_mode_code = <super> KEY_C
command_mode_code = kanshictl switch code

# AI training mode - Only use the laptop screen, turn off the G5 monitor.
binding_mode_train = <super> KEY_A
command_mode_train = kanshictl switch train

# Accessibility

# Animation
# The `animate` plugin WAS already in core.plugins, but there was no [animate] section
# -> it ran entirely on defaults.
#
# `fade_enabled_for` defaults to `type is "overlay"`. In Wayfire's criteria system,
# layer-shell surfaces (panel, notification centre) are type "overlay"
# — this is inferred from the docs, NOT something I could verify on your machine.
# If the panel still pops up instantly after adding this block, Wayfire doesn't
# animate layer-shell surfaces in this version; then fall back to CSS @keyframes in
# ~/.config/swaync/style.css instead.
#
# Three independent animation layers; all three can be on:
#   1. swaync  "transition-time": 350   (config.json)
#   2. Wayfire [animate] fade_duration  (here)
#   3. CSS @keyframes .control-center   (style.css)
[animate]
open_animation = zoom
close_animation = zoom
duration = 300
fade_enabled_for = type is "overlay" | app_id is "swaync-control-center"
fade_duration = 150
# rofi zooms in and out like an app window (Enhalation DP7). rofi can't animate itself;
# Wayfire does it. zoom_enabled_for wins over fade_enabled_for, so only rofi changes.
zoom_enabled_for = app_id is "rofi"
zoom_duration = 300ms circle
startup_duration = 600

# Zoom
[zoom]
modifier = <super>

# Desktop
[spread-overview]
border_color = 0.922 0.627 0.675 1.0
highlight_color = 0.5804 0.8863 0.8353 1.0   # default (RGBA — remember the 4th alpha component)
highlight_size  = 4
wallpaper_path = /home/thai/Pictures/Wallpapers/girl.png

# Expo
[expo]
toggle = <super> KEY_TAB
background = 0.922 0.627 0.675 1.0
duration = 250
# Select a workspace.
# Workspaces are arranged into a grid of 3 × 3.
# The numbering is left to right, line by line.
#
# ⇱ k ⇲
# h ⏎ l
# ⇱ j ⇲
# ‾   ‾
# See core.vwidth and core.vheight for configuring the grid.
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9

# Idle
# Example configuration:
#
# [idle]
# toggle = <super> KEY_Z
# screensaver_timeout = 300
# dpms_timeout = 600
#
# Disables the compositor going idle with Super + z.
# This will lock your screen after 300 seconds of inactivity, then turn off
# your displays after another 300 seconds.

# Output switcher
[oswitch]
# Switch to the next output.
next_output = <super> KEY_O
# Same with the window.
next_output_with_win = <super> <shift> KEY_O

# Place
[place]
mode = center

# Scale
[scale]
toggle = <super>
duration = 300
title_overlay = never
inactive_alpha = 1.0
minimized_alpha = 1.0
include_minimized = true

# Window rules
[window-rules]
maximize_kitty = on created if app_id is "kitty" then maximize

# You can get the properties of your applications with the following command:
# $ WAYLAND_DEBUG=1 alacritty 2>&1 | kak
#
# See Window rules for a complete backgroundreference.
# https://github.com/WayfireWM/wayfire/wiki/Configuration#window-rules

# Viewport swipe
[vswipe]
background = 0.922 0.627 0.675 1.0
fingers = 3
gap = 5


# Viewport switcher
[vswitch]
background = 0.922 0.627 0.675 1.0
gap = 5
duration = 250
binding_left = <alt> <super> KEY_LEFT
binding_down = <alt> <super> KEY_DOWN
binding_up = <alt> <super> KEY_UP
binding_right = <alt> <super> KEY_RIGHT
# Move the focused window with the same key-bindings, but add Shift.
with_win_left = <alt> <super> <ctrl> KEY_LEFT
with_win_down = <alt> <super> <ctrl> KEY_DOWN
with_win_up = <alt> <super> <ctrl> KEY_UP
with_win_right = <alt> <super> <ctrl> KEY_RIGHT

# Switch to workspaces 1-9 (Super + 1-9)
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9

# Move focused window to workspaces 1-9 and follow it (Super + Shift + 1-9)
with_win_1 = <super> <shift> KEY_1
with_win_2 = <super> <shift> KEY_2
with_win_3 = <super> <shift> KEY_3
with_win_4 = <super> <shift> KEY_4
with_win_5 = <super> <shift> KEY_5
with_win_6 = <super> <shift> KEY_6
with_win_7 = <super> <shift> KEY_7
with_win_8 = <super> <shift> KEY_8
with_win_9 = <super> <shift> KEY_9

# Decoration
[decoration]
# active_color = 0.922 0.627 0.675 1.0
# inactive_color = 0.118 0.118 0.18 1.0
border_size = 0
button_order = minimize maximize close
font = JetBrainsMono NerdFont
title_height = 0

# Utility

# Window management

# Fast switcher
[fast-switcher]
activate = <alt> KEY_ESC

# Grid
[grid]
#
# ⇱ ↑ ⇲   │ 7 8 9
# ← f →   │ 4 5 6
# ⇱ ↓ ⇲ d │ 1 2 3 0
# ‾   ‾
slot_bl = <super> KEY_KP1
slot_b = <super> KEY_KP2
slot_br = <super> KEY_KP3
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_tl = <super> KEY_KP7
slot_t = <super> KEY_KP8
slot_tr = <super> KEY_KP9
# Restore default.
restore = <super> KEY_DOWN | <super> KEY_KP0

# Follow focus
[follow-focus]
focus_delay = 0

# Move
[move]
activate = <super> BTN_LEFT

# Switcher
[switcher]
next_view = <alt> KEY_TAB
# prev_view = <alt> <shift> KEY_TAB
view_thumbnail_scale = 1.2
view_thumbnail_rotation = 0

# Resize
[resize]
activate = <super> BTN_RIGHT

# WM-Actions
# Actions related to window management functionalities.
#
# Example configuration:
#
# The `wm-actions` plugin is loaded in core.plugins, but it used to have no
# bindings -> loaded for nothing. Turn on a few useful ones:
[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_always_on_top = <super> KEY_X
toggle_sticky = <super> <shift> KEY_X

[focus-change]
up = <super> KEY_K
down = <super> KEY_J
left = <super> KEY_H
right = <super> KEY_L
