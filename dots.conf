# dots.conf — the manifest. One line per tracked path.
#
#   <mode>  <path>
#
# path is relative to the repo root and its first component picks the target:
#   home/…    ->  $HOME/…
#   system/…  ->  /…            (needs root; always copied, never symlinked)
#
# mode:
#   link   Symlink $HOME/<path> into this repo. Editing the live file edits the
#          repo, so these CANNOT drift — `git status` is their drift report.
#          Use for anything you hand-edit. A directory entry links the whole dir,
#          so new files inside it show up in the repo automatically.
#
#   copy   The application rewrites this file itself, so a symlink would either
#          be clobbered or would let the app commit noise into the repo. `dots`
#          keeps a snapshot and tells you when live and repo diverge.
#          Move them with `dots pull` (live -> repo) / `dots push` (repo -> live).
#
#   root   Lives under /etc. Copied, needs sudo, and `dots push` on these also
#          tells you which command to re-run (grub-mkconfig / mkinitcpio).

# ─────────────────────────── shell ────────────────────────────────────────────
link    home/.zshrc
link    home/.zprofile
link    home/.p10k.zsh
link    home/.bashrc
link    home/.bash_profile
link    home/.zsh/themes

# ────────────────────── wayfire session ───────────────────────────────────────
# start-wayfire must exist before .zprofile execs it — see docs/session.md
link    home/.local/bin/start-wayfire
link    home/.config/wayfire.ini
link    home/.config/kanshi/config
link    home/.config/wayfire/ss-fix.sh
link    home/.config/ipc-scripts
link    home/.config/environment.d/environment.conf

# ───────────────────── desktop components ─────────────────────────────────────
link    home/.config/rofi
link    home/.config/swaync
link    home/.config/quickshell/enhalation
link    home/.config/kitty/kitty.conf
link    home/.config/ranger/rifle.conf
link    home/.config/ranger/scope.sh

# ─────────────────────────── audio ────────────────────────────────────────────
# Drop-ins only. Never vendor /usr/share/pipewire defaults — they go stale
# silently every time PipeWire updates.
link    home/.config/pipewire/client.conf.d/10-resample.conf
link    home/.config/pipewire/pipewire.conf.d/10-clock.conf
link    home/.config/pipewire/pipewire-pulse.conf.d/10-resample.conf
link    home/.config/cava

# ───────────────────────── git + assets ───────────────────────────────────────
link    home/.config/git/ignore
link    home/.icons/oreo_pink_cursors
link    home/.icons/oreo_spark_dark_cursors
link    home/.icons/oreo_spark_lime_cursors
link    home/.icons/oreo_spark_pink_cursors
link    home/.icons/oreo_spark_purple_cursors
link    home/.icons/Graphite-Recolored-Catppuccin-Maroon
link    home/.icons/Graphite-Recolored-Catppuccin-Pink
link    home/.icons/Graphite-Recolored-Gruvbox-Purple

# ═══════════════════ copy-tracked: apps that rewrite themselves ═══════════════
# nwg-look regenerates all five of these on every Apply.
copy    home/.gtkrc-2.0
copy    home/.config/gtk-3.0/settings.ini
copy    home/.config/gtk-4.0/settings.ini
copy    home/.config/xsettingsd/xsettingsd.conf
copy    home/.config/nwg-look/config
copy    home/.icons/default/index.theme

# Editors and TUIs that persist UI state back into their config.
copy    home/.config/Code/User/settings.json
copy    home/.config/zed/settings.json
copy    home/.config/zed/keymap.json
copy    home/.config/btop/btop.conf
copy    home/.config/btop/themes/catppuccin_mocha.theme

# fcitx5 rewrites profile/ on every input-method switch.
copy    home/.config/fcitx5/config
copy    home/.config/fcitx5/profile
copy    home/.config/fcitx5/conf/notifications.conf

# easyeffects writes its db on every preset change.
copy    home/.config/easyeffects/db/easyeffectsrc
copy    home/.config/easyeffects/db/graphrc
copy    home/.config/easyeffects/db/bassLoudnessrc
copy    home/.config/easyeffects/db/equalizerrc

# ═══════════════════════════ system (/etc) ════════════════════════════════════
root    system/etc/default/grub
root    system/etc/mkinitcpio.conf
root    system/etc/modprobe.d/nvidia.conf
root    system/etc/modprobe.d/audio_disable_powersave.conf
