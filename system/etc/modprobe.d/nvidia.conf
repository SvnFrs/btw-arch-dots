# NVIDIA RTX 3060 Mobile (GA106M) — Acer Predator PT516-51s, hybrid Intel + NVIDIA.
#
# CONSOLIDATED. This used to be spread over three files:
#     nvidia.conf        (generated by EnvyControl)
#     nvidia-pm.conf
#     nvidia-power.conf
# nvidia-pm.conf and nvidia-power.conf BOTH set NVreg_DynamicPowerManagement=0x02.
# modprobe applies every matching line, so the value was set twice and whichever
# file sorted last won. Harmless while the values agreed — but the moment you
# edited one and not the other you would get a silent, hard-to-trace mismatch.
# Everything now lives here, once.
#
# NOTE: EnvyControl rewrites this file when you switch GPU modes. After running
# `envycontrol -s <mode>`, re-check with `dots status` and `dots pull` if it
# changed something you want to keep.

# Required for Wayland. Also passed on the kernel cmdline in /etc/default/grub;
# both are kept because the cmdline covers the case where this file is
# regenerated by EnvyControl without it.
options nvidia-drm modeset=1

# Page Attribute Table: faster CPU-side access to mapped video memory.
# InitializeSystemMemoryAllocations=0 skips zeroing system memory the driver
# allocates — less startup latency, at the cost of not pre-clearing that memory.
options nvidia NVreg_UsePageAttributeTable=1 NVreg_InitializeSystemMemoryAllocations=0

# Runtime D3 power management: lets the dGPU fully power down when idle.
# 0x02 = "coarse-grained", the supported setting for Turing and newer on laptops.
# This is the single biggest battery win on this machine — without it the 3060
# stays awake and costs several watts at idle.
options nvidia NVreg_DynamicPowerManagement=0x02

# Preserve VRAM contents across suspend so applications survive a lid close.
# Pairs with the nvidia-suspend/-resume/-hibernate systemd units, which the
# nvidia-utils package enables.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
